name: Add the IAU constellation charts
# Downloads the official IAU constellation charts (IAU and Sky & Telescope, via the IAU Office of
# Astronomy for Education, CC BY 4.0) into iau/, so the site can show them and work offline.
on:
  push:
    paths: ['.github/workflows/iau-charts.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the charts
        run: |
          mkdir -p iau
          failed=""
          for s in ursa-minor ursa-major draco cepheus bootes corona-borealis hercules lyra cygnus cassiopeia perseus auriga ophiuchus serpens-caput serpens-cauda sagitta aquila delphinus equuleus pegasus andromeda triangulum aries taurus gemini cancer leo virgo libra scorpius sagittarius capricornus aquarius pisces cetus orion eridanus lepus canis-major canis-minor carina puppis vela pyxis hydra crater corvus crux centaurus lupus ara corona-australis piscis-austrinus antlia apus caelum camelopardalis canes-venatici chamaeleon circinus columba coma-berenices dorado fornax grus horologium hydrus indus lacerta leo-minor lynx mensa microscopium monoceros musca norma octans pavo phoenix pictor reticulum sculptor scutum sextans telescopium triangulum-australe tucana volans vulpecula; do
            if [ ! -s "iau/$s.png" ]; then
              curl -fsSL --retry 3 -o "iau/$s.png" "https://astro4edu.org/media/diagrams/multimedia/$s-constellation-map_en.png" || { rm -f "iau/$s.png"; failed="$failed $s"; }
            fi
          done
          echo "Downloaded: $(ls iau | wc -l) charts"
          if [ -n "$failed" ]; then echo "::warning::Not found:$failed"; fi
      - name: Save them in the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iau
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Add the IAU constellation charts (CC BY 4.0)"
          git push
